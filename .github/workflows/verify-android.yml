name: android bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify-android.yml"
      - "apps/desktop/**"
      - "packages/content/**"
      - "packages/engine/**"
      - "package-lock.json"
      - "package.json"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-arm64-debug-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci
      - run: npm run typecheck
      - run: npm test --workspace apps/desktop
      - run: npm test --workspace packages/content
      - run: npm test --workspace packages/engine -- --run src/engine.test.ts
      - run: npm run android:build:apk --workspace apps/desktop -- --debug --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: rotunda-android-arm64-debug
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
