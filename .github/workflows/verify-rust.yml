name: verify Rust

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/**"
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"

permissions:
  contents: read

concurrency:
  group: verify-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          grep -RIlZ 'dl.google.com/linux/chrome' /etc/apt/sources.list.d | sudo xargs -0r rm -f
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Tauri test frontend and the Node sidecar
        run: |
          mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
          node scripts/prepare-game.mjs --node-only
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
