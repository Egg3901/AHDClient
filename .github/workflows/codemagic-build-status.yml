name: Codemagic Build Status

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Codemagic build ID
        required: true
        type: string

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Codemagic build status
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -eu
          test -n "$CODEMAGIC_API_TOKEN"
          test -n "$BUILD_ID"
          response=$(curl --fail --silent --show-error \
            -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
            "https://api.codemagic.io/builds/$BUILD_ID")
          printf '%s\n' "$response" | jq '
            def object_keys: if type == "object" then keys else [] end;
            {
              topLevelKeys: keys,
              dataKeys: (.data | object_keys),
              buildKeys: (.build | object_keys),
              resultKeys: (.result | object_keys),
              buildId: (.buildId // .id // .data.buildId // .data.id // .build.id // .result.buildId // .result.id),
              status: (.status // .data.status // .build.status // .result.status),
              buildStatus: .build.status,
              buildMessage: .build.message,
              version: .build.version,
              workflowId: (.workflowId // .data.workflowId // .build.workflowId // .result.workflowId),
              fileWorkflowId: .build.fileWorkflowId,
              branch: (.branch // .data.branch // .build.branch // .result.branch),
              commit: (.commit // .data.commit // .build.commit // .result.commit),
              startedAt: (.startedAt // .data.startedAt // .build.startedAt // .result.startedAt),
              finishedAt: (.finishedAt // .data.finishedAt // .build.finishedAt // .result.finishedAt),
              artifacts: ([.artifacts[]? // .data.artifacts[]? // .build.artifacts[]? // .result.artifacts[]? | {name, type, url, size}] // []),
              artefacts: (if (.build.artefacts | type) == "array" then [.build.artefacts[] | {name, type, url, size, status}] else {type: (.build.artefacts | type), keys: (.build.artefacts | object_keys)} end),
              buildActions: (if (.build.buildActions | type) == "array" then [.build.buildActions[] | {name, status, message, startedAt, finishedAt}] else {type: (.build.buildActions | type), keys: (.build.buildActions | object_keys)} end),
              appStoreConnectTasks: (if (.build.appStoreConnectTasks | type) == "array" then [.build.appStoreConnectTasks[] | {status, type, message, startedAt, finishedAt}] else {type: (.build.appStoreConnectTasks | type), keys: (.build.appStoreConnectTasks | object_keys)} end)
            }'
