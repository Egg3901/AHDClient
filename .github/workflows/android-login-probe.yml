name: Android login probe

# Installs an APK on an emulator, launches it, and
# walks the player sign-in path, failing on an ANR (tickets 1387, 1450).
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK to probe
        required: true
        default: https://ops.lakesidegames.net/downloads/AHDClient_2.4.0_universal.apk
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - env:
          APK_URL: ${{ inputs.apk_url }}
        run: curl -fsSL -o app.apk "$APK_URL"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android-login-probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-probe
          path: probe/
