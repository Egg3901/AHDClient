name: EAS private credential setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Transfer existing Apple credentials directly to EAS
        env:
          EXPO_TOKEN: ${{ secrets.LAKESIDE_EXPO_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          LAKESIDE_TESTFLIGHT_EMAIL: ${{ secrets.LAKESIDE_TESTFLIGHT_EMAIL }}
        run: python3 scripts/transfer-eas-credentials.py
