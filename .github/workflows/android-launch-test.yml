name: Android launch test

# Installs a built APK on stock emulators and checks it survives launch.
# Prints crash output (AndroidRuntime, native tombstones, Rust panics) so a
# player's "closes on open" report can be reproduced with a stack trace.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK to test
        required: true
        default: https://ops.lakesidegames.net/downloads/AHDClient_2.3.21_universal.apk
        type: string

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36, 37]
    continue-on-error: ${{ matrix.api == 37 }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: curl -fsSL -o app.apk "$APK_URL" && ls -l app.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android-launch-check.sh
