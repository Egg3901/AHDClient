<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A House Divided</title>
<style>
  :root {
    --paper: #fafafa;
    --ink: #141414;
    --muted: #8a8a8a;
    --line: #e4e4e4;
    --red: #b3232a;
    --blue: #1f3f9e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  /* ballot-paper dot grid */
  .pattern {
    position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(20,20,20,0.055) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  canvas.streaks { position: fixed; inset: 0; width: 100vw; height: 100vh; }

  .stage {
    position: relative; z-index: 2;
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    padding: 32px;
  }

  /* wordmark */
  .mast { text-align: center; }
  .mast svg { display: block; margin: 0 auto 14px; }
  .mast h1 {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(22px, 3.4vw, 34px); font-weight: 600;
    letter-spacing: 0.42em; text-indent: 0.42em;
  }
  .mast .sub {
    margin-top: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.5em; text-indent: 0.5em;
    color: var(--muted);
  }

  /* mode toggle */
  .toggle {
    position: relative; display: flex; border: 1px solid var(--ink);
    background: var(--paper); border-radius: 999px; padding: 3px; user-select: none;
  }
  .toggle .thumb {
    position: absolute; top: 3px; bottom: 3px; width: calc(50% - 3px);
    background: var(--ink); border-radius: 999px;
    transition: transform 220ms cubic-bezier(.7,0,.2,1);
  }
  .toggle[data-mode="mp"] .thumb { transform: translateX(100%); }
  .toggle button {
    position: relative; z-index: 1; border: 0; background: none; cursor: pointer;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.18em; padding: 9px 22px; min-width: 172px;
    color: var(--ink); transition: color 220ms;
  }
  .toggle button .tick { opacity: 0; margin-right: 6px; transition: opacity 220ms; }
  .toggle button.active { color: var(--paper); }
  .toggle button.active .tick { opacity: 1; }

  /* globe card */
  .globe-wrap {
    position: relative; width: min(46vh, 440px); aspect-ratio: 1;
    border-radius: 50%; border: 1px solid var(--line);
    background: #fff; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 12px 48px rgba(0,0,0,0.06);
  }
  .globe-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .globe-wrap iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    background: #fff;
  }
  .globe-view { position: absolute; inset: 0; opacity: 1; transition: opacity 260ms; }
  .globe-view.hidden { opacity: 0; pointer-events: none; }

  .live-chip {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px; z-index: 3;
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 4px 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.22em; color: var(--muted);
  }
  .live-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .toggle-anim .dot { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.25 } }

  /* actions */
  .actions { display: flex; gap: 10px; align-items: center; min-height: 40px; }
  .btn {
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.18em; padding: 11px 26px; cursor: pointer;
    border-radius: 2px;
  }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:hover { opacity: 0.82; }
  .caption {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.14em; color: var(--muted);
  }

  footer {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; z-index: 2;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.2em; color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    canvas.streaks { display: none; }
  }
</style>
</head>
<body>
<div class="pattern"></div>
<canvas class="streaks" id="streaks"></canvas>

<div class="stage">
  <div class="mast">
    <!-- dome mark, ink on paper -->
    <svg width="84" height="66" viewBox="0 0 184 146" aria-hidden="true">
      <g stroke="#141414" stroke-width="3" fill="none">
        <path d="M 14 100 A 78 78 0 0 1 170 100"/>
        <path d="M 36 100 A 56 56 0 0 1 148 100" stroke="#8a8a8a" stroke-width="2"/>
        <line x1="92" y1="0" x2="92" y2="22"/>
        <line x1="0" y1="100" x2="184" y2="100"/>
        <line x1="32" y1="100" x2="32" y2="130" stroke="#8a8a8a" stroke-width="2"/>
        <line x1="62" y1="100" x2="62" y2="130" stroke="#8a8a8a" stroke-width="2"/>
        <line x1="92" y1="100" x2="92" y2="130" stroke="#8a8a8a" stroke-width="2"/>
        <line x1="122" y1="100" x2="122" y2="130" stroke="#8a8a8a" stroke-width="2"/>
        <line x1="152" y1="100" x2="152" y2="130" stroke="#8a8a8a" stroke-width="2"/>
        <line x1="14" y1="130" x2="170" y2="130"/>
        <line x1="14" y1="143" x2="86" y2="143" stroke="#b3232a" stroke-width="2.5"/>
        <line x1="98" y1="143" x2="170" y2="143" stroke="#1f3f9e" stroke-width="2.5"/>
      </g>
    </svg>
    <h1>A HOUSE DIVIDED</h1>
    <div class="sub">ROTUNDA CLIENT</div>
  </div>

  <div class="toggle" id="toggle" data-mode="sp">
    <div class="thumb"></div>
    <button id="btn-sp" class="active"><span class="tick">&#10003;</span>SINGLEPLAYER</button>
    <button id="btn-mp"><span class="tick">&#10003;</span>MULTIPLAYER</button>
  </div>

  <div class="globe-wrap">
    <div class="globe-view" id="view-sp">
      <canvas id="globe"></canvas>
    </div>
    <div class="globe-view hidden" id="view-mp">
      <div class="live-chip toggle-anim"><span class="dot"></span>LIVE</div>
      <!-- In the client build this region is the hardened webview. -->
      <iframe title="live world" loading="lazy" data-src="https://www.ahousedividedgame.com"></iframe>
    </div>
  </div>

  <div class="actions" id="actions-sp">
    <button class="btn">NEW WORLD</button>
    <button class="btn ghost">LOAD SAVE</button>
  </div>
  <div class="actions" id="actions-mp" style="display:none">
    <button class="btn">ENTER WORLD</button>
    <span class="caption">live connection &middot; ahousedividedgame.com</span>
  </div>
</div>

<footer>ROTUNDA 0.1 &middot; POLYFORM NC 1.0.0</footer>

<script>
"use strict";
/* ---------- streak agents: red and blue lines darting across the paper ---------- */
(() => {
  const canvas = document.getElementById("streaks");
  const ctx = canvas.getContext("2d");
  let W, H, dpr;
  const PAPER = "250,250,250";

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = `rgb(${PAPER})`;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = "round";
  }
  window.addEventListener("resize", resize);
  resize();

  const SPEED = 340; // px/s
  const COLORS = ["#b3232a", "#1f3f9e"];

  function rand(a, b) { return a + Math.random() * (b - a); }

  class Agent {
    constructor(i) {
      this.color = COLORS[i % 2];
      this.x = rand(0, W); this.y = rand(0, H);
      this.setDir(rand(0, Math.PI * 2));
      this.mode = "wander";           // wander | check1 | check2
      this.timer = rand(1.2, 4);
      this.width = 1.6;
    }
    setDir(theta) { this.vx = Math.cos(theta) * SPEED; this.vy = Math.sin(theta) * SPEED; }
    step(dt) {
      this.timer -= dt;
      if (this.timer <= 0) {
        if (this.mode === "wander") {
          if (Math.random() < 0.34 && this.x > W * 0.08 && this.x < W * 0.8 && this.y > H * 0.1 && this.y < H * 0.85) {
            // checkmark: short stroke down-right...
            this.mode = "check1"; this.timer = 0.16; this.width = 2.6;
            this.setDir(Math.PI / 3.6); // ~50deg down-right
          } else {
            this.timer = rand(1.2, 4);  // dart: snap to a new straight heading
            this.setDir(rand(0, Math.PI * 2));
          }
        } else if (this.mode === "check1") {
          // ...then the long stroke up-right completes the tick
          this.mode = "check2"; this.timer = 0.34;
          this.setDir(-Math.PI / 4.2); // ~-43deg up-right
        } else {
          this.mode = "wander"; this.timer = rand(1.6, 4.5); this.width = 1.6;
          this.setDir(rand(0, Math.PI * 2));
        }
      }
      const px = this.x, py = this.y;
      this.x += this.vx * dt; this.y += this.vy * dt;
      // bounce
      if (this.x < 0 || this.x > W) { this.vx *= -1; this.x = Math.max(0, Math.min(W, this.x)); }
      if (this.y < 0 || this.y > H) { this.vy *= -1; this.y = Math.max(0, Math.min(H, this.y)); }
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.width;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(this.x, this.y); ctx.stroke();
    }
  }

  const agents = Array.from({ length: 6 }, (_, i) => new Agent(i));
  let last = performance.now();
  (function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    // fade previous frame toward paper: this is what leaves the streaks
    ctx.fillStyle = `rgba(${PAPER},0.085)`;
    ctx.fillRect(0, 0, W, H);
    for (const a of agents) a.step(dt);
    requestAnimationFrame(frame);
  })(last);
})();

/* ---------- singleplayer globe: wireframe sphere, election-tinted provinces ---------- */
(() => {
  const canvas = document.getElementById("globe");
  const ctx = canvas.getContext("2d");
  let S, R, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    S = canvas.clientWidth;
    canvas.width = S * dpr; canvas.height = S * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = S * 0.40;
  }
  window.addEventListener("resize", resize);
  resize();

  // deterministic province dots (mulberry32, fixed seed: same globe every boot)
  let s = 1953;
  const prng = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const dots = Array.from({ length: 170 }, () => {
    const lat = Math.asin(prng() * 2 - 1), lon = prng() * Math.PI * 2, r = prng();
    return { lat, lon, color: r < 0.38 ? "#b3232a" : r < 0.76 ? "#1f3f9e" : "#b9b9b9" };
  });

  let rot = 0, last = performance.now();
  (function frame(now) {
    const dt = (now - last) / 1000; last = now;
    rot += dt * 0.22;
    const cx = S / 2, cy = S / 2;
    ctx.clearRect(0, 0, S, S);

    ctx.strokeStyle = "rgba(20,20,20,0.14)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();

    // parallels
    for (let p = -60; p <= 60; p += 30) {
      const lat = p * Math.PI / 180, y = cy - R * Math.sin(lat), rx = R * Math.cos(lat);
      ctx.beginPath(); ctx.ellipse(cx, y, rx, rx * 0.14, 0, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(20,20,20,0.08)"; ctx.stroke();
    }
    // meridians
    for (let m = 0; m < 12; m++) {
      const lon0 = rot + m * Math.PI / 6;
      ctx.beginPath();
      let started = false;
      for (let t = -90; t <= 90; t += 4) {
        const lat = t * Math.PI / 180;
        const x3 = Math.cos(lat) * Math.sin(lon0), y3 = Math.sin(lat), z3 = Math.cos(lat) * Math.cos(lon0);
        if (z3 < 0) { started = false; continue; }
        const x = cx + R * x3, y = cy - R * y3;
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = "rgba(20,20,20,0.08)"; ctx.stroke();
    }
    // provinces
    for (const d of dots) {
      const lon = d.lon + rot;
      const x3 = Math.cos(d.lat) * Math.sin(lon), y3 = Math.sin(d.lat), z3 = Math.cos(d.lat) * Math.cos(lon);
      if (z3 < 0.05) continue;
      ctx.fillStyle = d.color;
      ctx.globalAlpha = 0.28 + z3 * 0.6;
      ctx.beginPath();
      ctx.arc(cx + R * x3, cy - R * y3, 1.1 + z3 * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  })(last);
})();

/* ---------- mode toggle ---------- */
(() => {
  const toggle = document.getElementById("toggle");
  const btnSp = document.getElementById("btn-sp"), btnMp = document.getElementById("btn-mp");
  const viewSp = document.getElementById("view-sp"), viewMp = document.getElementById("view-mp");
  const actSp = document.getElementById("actions-sp"), actMp = document.getElementById("actions-mp");
  const iframe = viewMp.querySelector("iframe");

  function setMode(mode) {
    toggle.dataset.mode = mode;
    const mp = mode === "mp";
    btnSp.classList.toggle("active", !mp);
    btnMp.classList.toggle("active", mp);
    viewSp.classList.toggle("hidden", mp);
    viewMp.classList.toggle("hidden", !mp);
    actSp.style.display = mp ? "none" : "";
    actMp.style.display = mp ? "" : "none";
    if (mp && !iframe.src) iframe.src = iframe.dataset.src; // lazy: only touch network when chosen
  }
  btnSp.addEventListener("click", () => setMode("sp"));
  btnMp.addEventListener("click", () => setMode("mp"));
})();
</script>
</body>
</html>
