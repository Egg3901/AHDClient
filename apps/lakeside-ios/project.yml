name: Lakeside
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  LakesideCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
targets:
  LakesideAsk:
    type: application
    platform: iOS
    sources: [Shared, Ask]
    dependencies:
      - package: LakesideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ask
        INFOPLIST_KEY_CFBundleDisplayName: Lakeside Ask
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LakesideOps:
    type: application
    platform: iOS
    sources: [Shared, Ops]
    dependencies:
      - package: LakesideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops
        INFOPLIST_KEY_CFBundleDisplayName: Lakeside Ops
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LakesideAsk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ask.uitests
        TEST_TARGET_NAME: LakesideAsk
  OpsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LakesideOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops.uitests
        TEST_TARGET_NAME: LakesideOps
  OpsSessionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SessionTests]
    dependencies:
      - target: LakesideOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops.sessiontests
schemes:
  LakesideAsk:
    build:
      targets:
        LakesideAsk: all
    test:
      targets: [AskUITests]
  LakesideOps:
    build:
      targets:
        LakesideOps: all
    test:
      targets: [OpsUITests, OpsSessionTests]
