[package]
name = "ahdsolo-desktop"
version = "0.1.0"
edition = "2021"
description = "A House Divided: Solo - Tauri shell"
authors = ["Lakeside Games"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Egg3901/AHDGame"
rust-version = "1.77.2"

[lib]
name = "ahdsolo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
