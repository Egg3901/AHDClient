[package]
name = "ahdclient-desktop"
version = "1.0.3"
edition = "2021"
description = "A House Divided multiplatform client shell"
authors = ["Lakeside Games"]
publish = false
license-file = "../../../LICENSE.md"
repository = "https://github.com/Egg3901/AHDClient"
rust-version = "1.77.2"

[lib]
name = "ahdclient_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# tauri-plugin-updater = "2"  # disabled: release channel + signing endpoint TBD by owner. See docs/RELEASING.md.
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
